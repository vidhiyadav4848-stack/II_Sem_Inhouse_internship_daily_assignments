<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Card Grid Using API</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#6dd5fa,#2980b9);
    min-height:100vh;
}

h1{
    color:white;
    font-weight:bold;
}

.card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:20px auto 10px;
    border:4px solid #0d6efd;
}

.card-body{
    text-align:center;
}

.card-title{
    font-weight:bold;
    color:#0d6efd;
}

.info{
    text-align:left;
    margin-top:15px;
}

.info p{
    margin:8px 0;
}

.loading{
    color:white;
    text-align:center;
    font-size:22px;
}

.footer{
    text-align:center;
    color:white;
    margin-top:40px;
}
</style>

</head>

<body>

<div class="container py-5">

<h1 class="text-center mb-5">
👨‍💼 User Card Grid Using API
</h1>

<div id="loading" class="loading">
<div class="spinner-border text-light"></div>
<p class="mt-3">Loading Users...</p>
</div>

<div class="row g-4" id="userContainer">

</div>

<div class="footer">
Made with ❤️ using HTML, CSS, Bootstrap & JavaScript
</div>

</div>

<script>

const container=document.getElementById("userContainer");
const loading=document.getElementById("loading");

fetch("https://jsonplaceholder.typicode.com/users")

.then(response=>response.json())

.then(users=>{

loading.style.display="none";

users.forEach(user=>{

const card=`

<div class="col-lg-4 col-md-6">

<div class="card h-100">

<img src="https://i.pravatar.cc/150?img=${user.id}" class="profile-img">

<div class="card-body">

<h4 class="card-title">${user.name}</h4>

<h6 class="text-secondary">@${user.username}</h6>

<div class="info">

<p><strong>📧 Email:</strong><br>${user.email}</p>

<p><strong>📞 Phone:</strong><br>${user.phone}</p>

<p><strong>🌐 Website:</strong><br>${user.website}</p>

<p><strong>🏢 Company:</strong><br>${user.company.name}</p>

<p><strong>🏠 City:</strong><br>${user.address.city}</p>

</div>

<a href="https://${user.website}" target="_blank" class="btn btn-primary w-100 mt-3">
Visit Website
</a>

</div>

</div>

</div>

`;

container.innerHTML+=card;

});

})

.catch(error=>{

loading.innerHTML="<h3>❌ Unable to Load Data</h3>";

console.log(error);

});

</script>

</body>
</html>
